<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Guidance Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .app {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin-top: 8px;
            color: #6b7280;
        }

        /* =========================
           DOCUMENT UPLOAD
           ========================= */

        .upload-container {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .upload-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .upload-header p {
            margin-top: 6px;
            margin-bottom: 0;
            color: #6b7280;
            font-size: 14px;
        }

        .upload-form {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 16px;
        }

        .upload-form input[type="file"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: white;
            font-size: 14px;
        }

        .upload-form button {
            height: 42px;
            padding: 0 20px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .upload-form button:hover {
            background: #1d4ed8;
        }

        .upload-form button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .upload-status {
            margin-top: 12px;
            font-size: 14px;
            min-height: 20px;
        }

        .upload-success {
            color: #15803d;
        }

        .upload-error {
            color: #dc2626;
        }

        /* =========================
           CHAT
           ========================= */

        .chat-container {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
        }

        .messages {
            min-height: 450px;
            max-height: 600px;
            overflow-y: auto;
            padding: 25px;
        }

        .message {
            margin-bottom: 20px;
        }

        .user-message {
            text-align: right;
        }

        .user-bubble {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 70%;
            text-align: left;
        }

        .assistant-bubble {
            display: inline-block;
            background: #f3f4f6;
            padding: 16px;
            border-radius: 12px;
            max-width: 80%;
            line-height: 1.6;
        }

        .sources {
            margin-top: 12px;
            padding: 12px;
            border-left: 3px solid #2563eb;
            background: #f9fafb;
            font-size: 14px;
        }

        .sources-title {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .source {
            margin-bottom: 6px;
            color: #4b5563;
        }

        .input-area {
            border-top: 1px solid #e5e7eb;
            padding: 18px;
            display: flex;
            gap: 10px;
        }

        .feedback-container {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .feedback-button {
            border: 1px solid #ddd;
            background: transparent;
            border-radius: 6px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .feedback-button:hover {
            background: #f5f5f5;
        }

        .feedback-button.selected {
            background: #e8e8e8;
        }

        textarea {
            flex: 1;
            resize: none;
            min-height: 50px;
            max-height: 120px;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        textarea:focus {
            border-color: #2563eb;
        }

        button {
            border: none;
            background: #2563eb;
            color: white;
            padding: 0 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .loading {
            color: #6b7280;
            font-style: italic;
        }

        .error {
            color: #dc2626;
        }

        /* =========================
           CHAT HISTORY
           ========================= */

        .chat-layout {
            display: flex;
            gap: 20px;
            align-items: stretch;
            width: 100%;
        }

        .chat-container {
            flex: 1;
            min-width: 0;
        }

        .history-container {
            width: 270px;
            flex-shrink: 0;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            height: 600px;
            display: flex;
            flex-direction: column;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .history-header h2 {
            margin: 0;
            font-size: 18px;
        }

        .new-chat-button {
            border: 1px solid #d1d5db;
            background: white;
            color: #1f2937;
            padding: 7px 10px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 12px;
        }

        .new-chat-button:hover {
            background: #f3f4f6;
        }

        .history-list {
            overflow-y: auto;
            flex: 1;
        }

        .history-empty,
        .history-loading {
            color: #6b7280;
            font-size: 14px;
            padding: 10px 4px;
            line-height: 1.5;
        }

        .history-item {
            width: 100%;
            display: block;
            text-align: left;
            background: white;
            color: #1f2937;
            border: 1px solid transparent;
            padding: 11px;
            margin-bottom: 7px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            line-height: 1.4;
        }

        .history-item:hover {
            background: #f3f4f6;
        }

        .history-item.active {
            background: #eff6ff;
            border-color: #bfdbfe;
        }

        .history-title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .history-meta {
            color: #6b7280;
            font-size: 11px;
        }

        /* =========================
        SEARCH SUGGESTIONS
        ========================= */

        .input-wrapper {
            position: relative;
            flex: 1;
        }

        .input-wrapper textarea {
            width: 100%;
            box-sizing: border-box;
        }

        .suggestions-dropdown {
            position: absolute;
            left: 0;
            right: 0;
            bottom: calc(100% + 8px);

            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);

            max-height: 220px;
            overflow-y: auto;

            display: none;

            z-index: 100;
        }

        .suggestions-dropdown.show {
            display: block;
        }

        .suggestion-item {
            width: 100%;

            border: none;
            border-bottom: 1px solid #f3f4f6;

            background: white;

            padding: 12px 14px;

            text-align: left;

            cursor: pointer;

            font-size: 14px;
            color: #1f2937;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background: #f3f4f6;
        }

        .suggestion-query {
            display: block;
        }

        .suggestion-meta {
            display: block;

            margin-top: 4px;

            color: #9ca3af;

            font-size: 11px;
        }

        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 1000px) {

            .chat-layout {
                flex-direction: column;
            }

            .history-container {
                width: 100%;
                height: auto;
                max-height: 250px;
            }

            .chat-container {
                width: 100%;
            }


            .app {
                margin: 20px auto;
                padding: 12px;
            }

            .upload-form {
                flex-direction: column;
                align-items: stretch;
            }

            .upload-form button {
                width: 100%;
            }

            .user-bubble,
            .assistant-bubble {
                max-width: 90%;
            }

            .input-area {
                flex-direction: column;
            }

            .input-wrapper {
                width: 100%;
            }

            .input-area button {
                min-height: 45px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =========================
         HEADER
         ========================= -->

    <div class="header">
        <h1>AI Guidance Chatbot</h1>
        <p>
            Ask questions about internal company policies and documents.
        </p>
    </div>


    <!-- =========================
         DOCUMENT UPLOAD
         ========================= -->

    <!-- <div class="upload-container">

        <div class="upload-header">
            <h2>Knowledge Base</h2>

            <p>
                Upload a document to add it to the internal knowledge base.
            </p>
        </div>

        <form id="uploadForm" class="upload-form">

            <input
                type="file"
                id="documentFile"
                accept=".pdf,.docx,.xlsx,.png,.jpg,.jpeg"
                required
            >

            <button
                id="uploadButton"
                type="submit"
            >
                Upload Document
            </button>

        </form>

        <div
            id="uploadStatus"
            class="upload-status"
        ></div>

    </div> -->


    <!-- =========================
         CHAT
         ========================= -->

    <div class="chat-layout">

        <div class="history-container">

            <div class="history-header">
                <h2>Chat History</h2>

                <button
                    id="newChatButton"
                    class="new-chat-button"
                    type="button"
                >
                    New Chat
                </button>
            </div>

            <div
                id="historyList"
                class="history-list"
            >
                <div class="history-empty">
                    No previous conversations yet.
                </div>
            </div>

        </div>

        <div class="chat-container">

            <div
                id="messages"
                class="messages"
            >

                <div class="message">

                    <div class="assistant-bubble">

                        Hello. Ask me a question about the company's
                        internal knowledge base.

                    </div>

                </div>

            </div>

            <form
                id="chatForm"
                class="input-area"
            >

                <div class="input-wrapper">

                    <textarea
                        id="question"
                        placeholder="Ask a question..."
                        required
                    ></textarea>

                    <div
                        id="suggestionsDropdown"
                        class="suggestions-dropdown"
                    ></div>

                </div>

                <button
                    id="sendButton"
                    type="submit"
                >
                    Send
                </button>

            </form>

        </div>

    </div>


</div>


<script>

/* =========================================================
   CHAT ELEMENTS
   ========================================================= */

const form = document.getElementById("chatForm");

const questionInput =
    document.getElementById("question");

const suggestionsDropdown =
    document.getElementById("suggestionsDropdown");

let suggestionTimer = null;

let suggestionRequest = null;

const messages =
    document.getElementById("messages");

const sendButton =
    document.getElementById("sendButton");


/* =========================================================
   CHAT HISTORY
   ========================================================= */

const historyList =
    document.getElementById("historyList");

const newChatButton =
    document.getElementById("newChatButton");

let sessionId = null;

const HISTORY_STORAGE_KEY =
    "ai_guidance_chat_sessions";


function getStoredSessionIds() {

    try {

        const stored =
            localStorage.getItem(
                HISTORY_STORAGE_KEY
            );

        return stored
            ? JSON.parse(stored)
            : [];

    } catch (error) {

        console.error(
            "Failed to read stored sessions:",
            error
        );

        return [];
    }
}


function saveSessionId(id) {

    if (!id) {
        return;
    }

    let sessionIds =
        getStoredSessionIds();

    sessionIds =
        sessionIds.filter(
            storedId => storedId !== id
        );

    sessionIds.unshift(id);

    sessionIds =
        sessionIds.slice(0, 50);

    localStorage.setItem(
        HISTORY_STORAGE_KEY,
        JSON.stringify(sessionIds)
    );
}


function removeStoredSessionId(id) {

    const sessionIds =
        getStoredSessionIds().filter(
            storedId => storedId !== id
        );

    localStorage.setItem(
        HISTORY_STORAGE_KEY,
        JSON.stringify(sessionIds)
    );
}


function getHistoryTitle(messages, summary) {

    if (summary) {

        const firstLine =
            summary
                .split("\n")
                .map(line => line.trim())
                .find(Boolean);

        if (firstLine) {

            return firstLine.length > 60
                ? firstLine.slice(0, 60) + "..."
                : firstLine;
        }
    }

    const firstUserMessage =
        messages.find(
            message =>
                message.role === "user"
        );

    if (firstUserMessage) {

        const content =
            firstUserMessage.content || "Conversation";

        return content.length > 60
            ? content.slice(0, 60) + "..."
            : content;
    }

    return "Conversation";
}


function formatHistoryDate(value) {

    if (!value) {
        return "";
    }

    const date =
        new Date(value);

    if (Number.isNaN(date.getTime())) {
        return "";
    }

    return date.toLocaleString(
        undefined,
        {
            dateStyle: "short",
            timeStyle: "short"
        }
    );
}


function clearChatMessages() {

    messages.innerHTML = `

        <div class="message">

            <div class="assistant-bubble">

                Hello. Ask me a question about the company's
                internal knowledge base.

            </div>

        </div>

    `;
}


async function loadHistory() {

    const sessionIds =
        getStoredSessionIds();

    if (!sessionIds.length) {

        historyList.innerHTML = `
            <div class="history-empty">
                No previous conversations yet.
            </div>
        `;

        return;
    }

    historyList.innerHTML = `
        <div class="history-loading">
            Loading history...
        </div>
    `;

    const conversations = [];

    for (const id of sessionIds) {

        try {

            const response =
                await fetch(
                    `/chat/history/${encodeURIComponent(id)}`
                );

            if (response.status === 404) {

                removeStoredSessionId(id);
                continue;
            }

            if (!response.ok) {
                continue;
            }

            const data =
                await response.json();

            const conversationMessages =
                data.messages || [];

            if (!conversationMessages.length) {
                continue;
            }

            conversations.push({
                session_id:
                    data.session_id || id,

                messages:
                    conversationMessages,

                summary:
                    data.summary ||
                    data.conversation_summary ||
                    null,

                updated_at:
                    data.updated_at ||
                    conversationMessages[
                        conversationMessages.length - 1
                    ]?.created_at ||
                    null
            });

        } catch (error) {

            console.error(
                "Failed to load history:",
                id,
                error
            );
        }
    }

    if (!conversations.length) {

        historyList.innerHTML = `
            <div class="history-empty">
                No previous conversations yet.
            </div>
        `;

        return;
    }

    historyList.innerHTML = "";

    conversations.forEach(
        conversation => {

            const item =
                document.createElement("button");

            item.type = "button";
            item.className = "history-item";

            if (
                conversation.session_id ===
                sessionId
            ) {
                item.classList.add("active");
            }

            const title =
                getHistoryTitle(
                    conversation.messages,
                    conversation.summary
                );

            item.innerHTML = `

                <div class="history-title">
                    ${escapeHtml(title)}
                </div>

                <div class="history-meta">
                    ${conversation.messages.length} messages
                    ${
                        conversation.updated_at
                            ? " · " +
                              escapeHtml(
                                  formatHistoryDate( 
                                      conversation.updated_at
                                  )
                              )
                            : ""
                    }
                </div>

            `;

            item.addEventListener(
                "click",
                function() {

                    loadConversation(
                        conversation.session_id,
                        conversation.messages
                    );
                }
            );

            historyList.appendChild(item);
        }
    );
}


function renderLoadedMessages(messageItems) {

    messages.innerHTML = "";

    messageItems.forEach(
        message => {

            if (
                message.role === "user"
            ) {

                addUserMessage(
                    message.content
                );

            } else if (
                message.role === "assistant"
            ) {

                addAssistantMessage(
                    message.content,
                    message.citations || [],
                    message.id
                );
            }
        }
    );

    scrollToBottom();
}


async function loadConversation(
    selectedSessionId,
    existingMessages = null
) {

    try {

        let conversationMessages =
            existingMessages;

        if (!conversationMessages) {

            const response =
                await fetch(
                    `/chat/history/${encodeURIComponent(selectedSessionId)}`
                );

            if (!response.ok) {

                throw new Error(
                    "Failed to load conversation."
                );
            }

            const data =
                await response.json();

            conversationMessages =
                data.messages || [];
        }

        sessionId =
            selectedSessionId;

        saveSessionId(
            selectedSessionId
        );

        renderLoadedMessages(
            conversationMessages
        );

        document
            .querySelectorAll(".history-item")
            .forEach(item => {

                item.classList.remove(
                    "active"
                );
            });

        // Rebuild the list so the active item is
        // unambiguous even when two titles are identical.
        await loadHistory();

        questionInput.focus();

    } catch (error) {

        console.error(
            "Conversation load error:",
            error
        );
    }
}


function startNewChat() {

    sessionId = null;

    clearChatMessages();

    document
        .querySelectorAll(".history-item")
        .forEach(item => {

            item.classList.remove(
                "active"
            );
        });

    questionInput.value = "";
    questionInput.focus();
}


newChatButton.addEventListener(
    "click",
    startNewChat
);

/* =========================================================
   CHAT UI FUNCTIONS
   ========================================================= */

function addUserMessage(question) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message user-message";

    wrapper.innerHTML = `
        <div class="user-bubble">
            ${escapeHtml(question)}
        </div>
    `;

    messages.appendChild(wrapper);

    scrollToBottom();
}


function addAssistantMessage(answer, sources, messageId) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message";

    let sourcesHtml = "";

    if (
        sources &&
        sources.length > 0
    ) {

        sourcesHtml = `
            <div class="sources">

                <div class="sources-title">
                    Sources
                </div>

                ${sources.map(source => {

                    const sourceName =
                        typeof source === "string"
                            ? source
                            : source.source || "Unknown source";

                    const page =
                        typeof source === "object"
                            ? source.page
                            : null;

                    return `
                        <div class="source">

                            ${escapeHtml(sourceName)}

                            ${
                                page
                                    ? ` — Page ${page}`
                                    : ""
                            }

                        </div>
                    `;

                }).join("")}

            </div>
        `;
    }

    wrapper.innerHTML = `

        <div class="assistant-bubble">

            <div>
                ${escapeHtml(answer)}
            </div>

            ${sourcesHtml}

            <div class="feedback-container">

                <button
                    class="feedback-button"
                    data-rating="up"
                    type="button"
                    title="Helpful"
                >
                    👍
                </button>

                <button
                    class="feedback-button"
                    data-rating="down"
                    type="button"
                    title="Not helpful"
                >
                    👎
                </button>

            </div>

        </div>

    `;

    messages.appendChild(wrapper);

    const feedbackButtons =
        wrapper.querySelectorAll(
            ".feedback-button"
        );

    feedbackButtons.forEach(button => {

        button.addEventListener(
            "click",
            async function() {

                const rating =
                    button.dataset.rating;

                try {

                    const response =
                        await fetch(
                            "/feedback",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    message_id: messageId,
                                    rating: rating
                                })
                            }
                        );

                    if (!response.ok) {

                        throw new Error(
                            `Feedback failed: ${response.status}`
                        );

                    }

                    feedbackButtons.forEach(
                        feedbackButton => {

                            feedbackButton.classList.remove(
                                "selected"
                            );

                        }
                    );

                    button.classList.add(
                        "selected"
                    );

                } catch (error) {

                    console.error(
                        "Feedback error:",
                        error
                    );

                }

            }
        );

    });

    scrollToBottom();
}


function addLoadingMessage() {

    const wrapper =
        document.createElement("div");

    wrapper.id = "loading";

    wrapper.className =
        "message";

    wrapper.innerHTML = `

        <div class="assistant-bubble loading">

            Searching internal knowledge...

        </div>

    `;

    messages.appendChild(wrapper);

    scrollToBottom();
}


function removeLoadingMessage() {

    const loading =
        document.getElementById("loading");

    if (loading) {
        loading.remove();
    }
}


function scrollToBottom() {

    messages.scrollTop =
        messages.scrollHeight;
}


function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;
}


/* =========================================================
   SEARCH SUGGESTIONS
   ========================================================= */

function hideSuggestions() {

    suggestionsDropdown.classList.remove("show");

    suggestionsDropdown.innerHTML = "";
}


function showSuggestions(suggestions) {

    if (
        !suggestions ||
        suggestions.length === 0
    ) {
        hideSuggestions();
        return;
    }

    suggestionsDropdown.innerHTML = "";

    suggestions.forEach(
        function(suggestion) {

            const button =
                document.createElement("button");

            button.type = "button";

            button.className =
                "suggestion-item";

            const query =
                suggestion.query || "";

            button.textContent = query;

            button.addEventListener(
                "click",
                function() {

                    questionInput.value =
                        query;

                    hideSuggestions();

                    questionInput.focus();
                }
            );

            suggestionsDropdown.appendChild(
                button
            );
        }
    );

    suggestionsDropdown.classList.add("show");
}


async function fetchSuggestions(query) {

    const searchText =
        query.trim();

    if (searchText.length < 2) {

        hideSuggestions();

        return;
    }

    try {

        if (suggestionRequest) {
            suggestionRequest.abort();
        }

        suggestionRequest =
            new AbortController();

        const response =
            await fetch(
                `/chat/suggestions?q=${encodeURIComponent(searchText)}&limit=5`,
                {
                    signal:
                        suggestionRequest.signal
                }
            );

        if (!response.ok) {

            hideSuggestions();

            return;
        }

        const data =
            await response.json();

        showSuggestions(
            data.suggestions || []
        );

    } catch (error) {

        if (
            error.name !==
            "AbortError"
        ) {

            console.error(
                "Failed to load suggestions:",
                error
            );

            hideSuggestions();
        }
    }
}


questionInput.addEventListener(
    "input",
    function() {

        const query =
            questionInput.value.trim();

        clearTimeout(
            suggestionTimer
        );

        if (query.length < 2) {

            hideSuggestions();

            return;
        }

        // Do not call suggestions API if input is too long
        if (query.length > 10000) {

            hideSuggestions();

            return;
        }

        if (query.split(/\s+/).length > 1000) {

            hideSuggestions();

            return;
        }

        suggestionTimer =
            setTimeout(
                function() {

                    fetchSuggestions(
                        query
                    );

                },
                300
            );
    }
);


document.addEventListener(
    "click",
    function(event) {

        if (
            !event.target.closest(
                ".input-wrapper"
            )
        ) {

            hideSuggestions();
        }
    }
);


/* =========================================================
   CHAT API
   ========================================================= */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        hideSuggestions();

        const question =
            questionInput.value.trim();

        if (!question) {
            return;
        }

        /*
        * Client-side validation.
        * Backend validation is still the final security check.
        */
        if (question.length > 10000) {
            addAssistantMessage(
                "Question is too long. Maximum allowed length is 10000 characters.",
                [],
                null
            );
            return;
        }

        if (question.split(/\s+/).length > 1000) {
            addAssistantMessage(
                "Question is too long. Maximum allowed length is 1000 words.",
                [],
                null
            );
            return;
        }

        addUserMessage(question);

        questionInput.value = "";

        sendButton.disabled = true;

        addLoadingMessage();

        try {

            const response =
                await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        session_id: sessionId,

                        question: question,

                        k: 10

                    })

                });


            removeLoadingMessage();


            if (!response.ok) {

                let errorMessage =
                    `Request failed: ${response.status}`;

                try {
                    const errorData =
                        await response.json();

                    errorMessage =
                        errorData.detail ||
                        errorData.message ||
                        errorMessage;

                } catch (parseError) {
                    console.error(
                        "Failed to parse error response:",
                        parseError
                    );
                }

                throw new Error(errorMessage);
            }


            const data =
                await response.json();

            if (data.session_id) {

                sessionId =
                    data.session_id;

                saveSessionId(
                    sessionId
                );

                loadHistory();
            }

            let answer;

            let sources = [];


            if (typeof data === "string") {

                answer = data;

            } else {

                answer =
                    data.answer ||
                    data.response ||
                    data.message ||
                    "No answer returned.";

                sources =
                    data.sources ||
                    [];

            }


            addAssistantMessage(
                answer,
                sources,
                data.message_id
            );


        } catch (error) {

            removeLoadingMessage();

            addAssistantMessage(
                error.message || "Something went wrong while getting the answer.",
                [],
                null
            );

            console.error(error);


        } finally {

            sendButton.disabled = false;

            questionInput.focus();

        }

    }
);


/* =========================================================
   ENTER TO SEND
   ========================================================= */

questionInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            form.requestSubmit();

        }

    }
);


/* =========================================================
   DOCUMENT UPLOAD
   ========================================================= */

const uploadForm =
    document.getElementById("uploadForm");

const documentFile =
    document.getElementById("documentFile");

const uploadButton =
    document.getElementById("uploadButton");

const uploadStatus =
    document.getElementById("uploadStatus");


uploadForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const file =
            documentFile.files[0];


        if (!file) {

            uploadStatus.textContent =
                "Please select a file.";

            uploadStatus.className =
                "upload-status upload-error";

            return;

        }


        const formData =
            new FormData();

        formData.append(
            "file",
            file
        );


        uploadButton.disabled = true;

        uploadButton.textContent =
            "Uploading...";


        uploadStatus.textContent =
            "Processing document...";

        uploadStatus.className =
            "upload-status";


        try {

            const response =
                await fetch(
                    "/documents/upload",
                    {
                        method: "POST",
                        body: formData
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    `Upload failed: ${response.status}`
                );

            }


            /*
             * Duplicate document
             */

            if (
                data.status ===
                "already_exists"
            ) {

                uploadStatus.textContent =
                    `${data.filename} already exists in the knowledge base.`;

                uploadStatus.className =
                    "upload-status upload-success";


            } else {

                /*
                 * New document
                 */

                uploadStatus.textContent =
                    `${data.filename} uploaded successfully. ` +
                    `${data.chunks_added} chunks added to the knowledge base.`;

                uploadStatus.className =
                    "upload-status upload-success";

            }


            /*
             * Clear selected file
             */

            documentFile.value = "";


        } catch (error) {

            console.error(error);


            uploadStatus.textContent =
                error.message ||
                "Something went wrong while uploading.";

            uploadStatus.className =
                "upload-status upload-error";


        } finally {

            uploadButton.disabled = false;

            uploadButton.textContent =
                "Upload Document";

        }

    }
);

</script>
