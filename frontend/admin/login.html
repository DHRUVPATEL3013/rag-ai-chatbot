<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            width: 360px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
        }

        h1 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            color: #dc2626;
            margin-top: 12px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>Admin Login</h1>

    <form id="loginForm">

        <label>
            Username
        </label>

        <input
            id="username"
            type="text"
            required
        >

        <label>
            Password
        </label>

        <input
            id="password"
            type="password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div id="error" class="error"></div>

</div>

<script>

const form = document.getElementById("loginForm");

const error = document.getElementById("error");


form.addEventListener("submit", async function(event) {

    event.preventDefault();

    error.textContent = "";

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;


    try {

        const response = await fetch(
            "/admin/login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    username: username,
                    password: password
                })
            }
        );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Login failed."
            );

        }


        window.location.href =
            "/admin/upload.html";


    } catch (err) {

        error.textContent =
            err.message;

    }

});

</script>

</body>
</html>
